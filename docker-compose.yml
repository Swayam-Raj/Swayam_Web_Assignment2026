version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: expense_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: expensedb
      POSTGRES_USER: expenseuser
      POSTGRES_PASSWORD: expensepass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - expense_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expenseuser -d expensedb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expense_backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: expensedb
      DB_USER: expenseuser
      DB_PASSWORD: expensepass
      PORT: 5000
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - expense_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: expense_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - expense_network

networks:
  expense_network:
    driver: bridge

volumes:
  postgres_data:
